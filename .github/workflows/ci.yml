name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: edtech_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edtech_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=edtech_test;Password=ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EducationGamePlatform.sln --locked-mode
      - run: dotnet tool restore
      - run: dotnet build EducationGamePlatform.sln -c Release --no-restore
      - run: dotnet ef migrations has-pending-model-changes --project src/EducationGamePlatform/EducationGamePlatform.csproj
      - run: dotnet test EducationGamePlatform.sln -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yml --profile app config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yml -f deploy/compose.release.yml --profile app config --quiet
      - run: bash -n deploy/update.sh
      - run: docker build -f deploy/Dockerfile -t edtech-api:ci .
      - name: Start the release stack and check the published course
        env:
          EDTECH_IMAGE: edtech-api:ci
        run: |
          set -euo pipefail
          compose=(docker compose --env-file deploy/.env.example -f deploy/compose.yml -f deploy/compose.release.yml --profile app)
          trap '"${compose[@]}" logs --no-color --tail 80' ERR
          "${compose[@]}" up -d --no-build api
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 3 http://127.0.0.1:5244/health/ready
          curl --fail --silent --show-error http://127.0.0.1:5244/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:5244/api/public/courses | jq -e 'any(.[]; .slug == "electrical-engineering")'
          curl --fail --silent --show-error http://127.0.0.1:5244/api/auth/registration |
            jq -e '.canRegister and .requiresConsent and (.consent.version | endswith("-draft")) and (.consent.text | length > 0)'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the verified main version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is already on main."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:main" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:main"
