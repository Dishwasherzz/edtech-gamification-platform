<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТПУ // Учебный модуль</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo-group">
      <div class="logo-icon"></div>
      <div class="logo-text">
        <span class="logo-title">ТПУ // УЧЕБНЫЙ МОДУЛЬ</span>
        <span class="logo-subtitle">электротехника</span>
      </div>
    </div>

    <nav class="nav-links">
      <a href="#/">Главная</a>
      <a href="#/profile">Прогресс</a>
      <a href="#/instructions">Правила</a>

    <div class="header-actions">

  <!-- Сюда подставляются экраны -->

  <p id="global-error" class="error" role="alert"></p>
